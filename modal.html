
<div class="modal-overlay" id="formModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Add Record Entry</h3>
      <button type="button" class="btn-close-modal" id="closeModalIcon">
        &times;
      </button>
    </div>
    <form id="recordForm">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group span-full">
            <label for="owner">Owner Name</label>
            <input
              type="text"
              id="owner"
              placeholder="e.g. John Doe"
              required
              autocomplete="off"
            />
          </div>

          <div class="form-group span-full">
            <label for="box_number">Box Number</label>
            <input
              type="number"
              id="box_number"
              placeholder="e.g. 774053..."
              required
              autocomplete="off"
            />
          </div>

          <div class="form-group span-full">
            <label for="pin">PIN</label>
            <input type="number" id="pin" value="0" min="0" />
          </div>

          <div class="form-group span-full">
            <label for="record_date">Record Date</label>
            <input type="date" id="record_date" required />
          </div>

          <div class="form-group">
            <label for="box_type">Box Type</label>
            <select id="box_type" required style="cursor: pointer">
              <option value="" disabled selected hidden>
                Choose box type...
              </option>
              <option value="SATLITE">SATLITE</option>
              <option value="CIGNAL">CIGNAL</option>
              <option value="GSAT PNOY">GSAT PNOY</option>
              <option value="GSAT HD">GSAT HD</option>
            </select>
          </div>

          <div class="form-group">
            <label for="package">Package Plan</label>
            <select id="package" required style="cursor: pointer" disabled>
              <option value="" disabled selected hidden>
                Select box type first...
              </option>
            </select>
          </div>

          <div class="form-group span-full">
            <label for="note">Note / Remarks (Optional)</label>
            <input
              type="text"
              id="note"
              placeholder="Additional details..."
              autocomplete="off"
            />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="closeModalBtn">
          Cancel
        </button>
        <button type="submit" class="btn-primary">Save Entry</button>
      </div>
    </form>
  </div>
</div>
