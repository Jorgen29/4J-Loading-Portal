
<style>
  /* Fixes the icon spacing and prevents text overlapping */
  .input-icon-wrapper {
    position: relative;
    width: 100%;
  }

  /* Targets only the generic decoration icons on the left (User and Lock) */
  .input-icon-wrapper i:not(.toggle-password-btn) {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    z-index: 10;
    pointer-events: none;
    width: 16px;
    text-align: center;
  }

  .login-input {
    width: 100%;
    padding: 12px 42px 12px 42px !important; /* Safety padding clearance on both left and right edges */
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  /* New distinct styles for the right-side eye icon button toggler */
  .toggle-password-btn {
    position: absolute;
    right: 14px; /* Forces the eye icon to sit cleanly on the far right */
    left: auto !important; /* Overrides any cascading left rules */
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    cursor: pointer;
    z-index: 20;
    pointer-events: auto !important; /* Enables mouse click events to register */
    width: 16px;
    text-align: center;
    transition: color 0.15s ease;
  }

  .toggle-password-btn:hover {
    color: var(--color-blue-main);
  }
</style>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-header">
      <i class="fa-solid fa-truck-ramp-box"></i>
      <h3>4J Loading Record</h3>
      <p>Please log in to manage satellite accounts</p>
    </div>
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="loginUser">Username</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-user"></i>
          <input
            type="text"
            id="loginUser"
            class="login-input"
            placeholder="Enter username"
            required
            autocomplete="off"
          />
        </div>
      </div>
      <div class="form-group">
        <label for="loginPass">Password</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <i
            class="fa-solid fa-eye toggle-password-btn"
            id="togglePasswordBtn"
          ></i>
          <input
            type="password"
            id="loginPass"
            class="login-input"
            placeholder="Enter password"
            required
          />
        </div>
      </div>
      <button type="submit" class="btn-login">Authorized Sign In</button>
    </form>
  </div>
</div>
