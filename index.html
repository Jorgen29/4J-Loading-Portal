<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4J Loading Record</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="manifest" href="js/manifest.json" />
    <link
      href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-minimal/minimal.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div id="loginContainer"></div>
    <div id="modalContainer"></div>

    <div class="container" id="dashboardContainer">
      <div class="dashboard-header">
        <div class="dashboard-title-wrapper">
          <i class="fa-solid fa-truck-ramp-box"></i>
          <h2>4J Loading Record</h2>
        </div>
        <div class="header-actions-group">
          <button class="btn-portal" id="openPortalBtn">
            <i class="fa-solid fa-globe"></i> GSAT Portal
          </button>
          <button class="btn-primary" id="openModalBtn">
            <i class="fa-solid fa-plus"></i> Add New Record
          </button>
          <button class="btn-logout" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i> Sign Out
          </button>
        </div>
      </div>

      <div class="controls-bar">
        <div style="display: flex; gap: 12px; flex-grow: 1; flex-wrap: wrap">
          <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Search database records..."
            />
          </div>

          <select id="boxTypeFilter" class="select-filter">
            <option value="ALL">All Box Types</option>
            <option value="SATLITE">SATLITE</option>
            <option value="CIGNAL">CIGNAL</option>
            <option value="GSAT PNOY">GSAT PNOY</option>
            <option value="GSAT HD">GSAT HD</option>
          </select>
        </div>

        <div style="display: flex; align-items: center">
          <label for="rowsPerPage"
            ><i
              class="fa-solid fa-list-numeric"
              style="margin-right: 6px; color: var(--text-muted)"
            ></i
            >Rows per page:</label
          >
          <select
            id="rowsPerPage"
            class="select-filter"
            style="padding: 6px 12px; border-radius: 6px; margin-left: 8px"
          >
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>
                <i
                  class="fa-solid fa-hashtag"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >ID
              </th>
              <th>
                <i
                  class="fa-solid fa-user"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >Owner
              </th>
              <th>
                <i
                  class="fa-solid fa-box"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >Box Number
              </th>
              <th>
                <i
                  class="fa-solid fa-key"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >PIN
              </th>
              <th>
                <i
                  class="fa-solid fa-tags"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >Package
              </th>
              <th>
                <i
                  class="fa-solid fa-tv"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >Box Type
              </th>
              <th>
                <i
                  class="fa-solid fa-calendar-days"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >Date
              </th>
              <th>
                <i
                  class="fa-solid fa-comment"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >Note
              </th>
              <th>
                <i
                  class="fa-solid fa-sliders"
                  style="margin-right: 6px; font-size: 0.7rem"
                ></i
                >Actions
              </th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="pagination-container">
        <div id="paginationInfo">
          <i
            class="fa-solid fa-chart-simple"
            style="margin-right: 8px; color: var(--text-muted)"
          ></i
          >Showing 0 to 0 of 0 entries
        </div>
        <div class="pagination-buttons" id="paginationButtons"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>

    <!-- PORTAL GSAT PNOY -->
    <script src="js/portal.js"></script>

    <script>
      console.log("LOG: Initializing Supabase client with URL:", SUPABASE_URL);
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      let db = [];
      let currentPage = 1;
      let rowsPerPage = 25;
      let filteredRecords = [];

      const tableBody = document.getElementById("tableBody");
      const searchInput = document.getElementById("searchInput");
      const boxTypeFilter = document.getElementById("boxTypeFilter");
      const rowsPerPageSelect = document.getElementById("rowsPerPage");
      const paginationButtons = document.getElementById("paginationButtons");
      const paginationInfo = document.getElementById("paginationInfo");

      let formModal,
        recordForm,
        boxTypeDropdown,
        packageDropdown,
        loginScreen,
        loginForm;
      let currentEditRecordId = null;

      const packageMatrix = {
        "GSAT PNOY": ["120", "220", "320", "420", "520"],
        "GSAT HD": ["120", "220", "320", "420", "520"],
        CIGNAL: [
          "120",
          "200",
          "220",
          "320",
          "470",
          "520",
          "620",
          "820",
          "1020",
        ],
        SATLITE: ["49", "99", "149", "199", "299"],
      };

      async function generateSHA256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map((b) => b.toString(16).padStart(2, "0")).join("");
      }

      function getLocalDateISOString() {
        const today = new Date();
        const offset = today.getTimezoneOffset();
        const localizedDate = new Date(today.getTime() - offset * 60 * 1000);
        return localizedDate.toISOString().split("T")[0];
      }

      document.addEventListener("DOMContentLoaded", () => {
        console.log("LOG: DOM Content Loaded. Fetching components...");
        const fetchLogin = fetch("login.html").then((res) => res.text());
        const fetchModal = fetch("modal.html").then((res) => res.text());

        Promise.all([fetchLogin, fetchModal])
          .then(([loginHtml, modalHtml]) => {
            console.log("LOG: Component files downloaded successfully.");
            document.getElementById("loginContainer").innerHTML = loginHtml;
            document.getElementById("modalContainer").innerHTML = modalHtml;

            initializeSystemControls();
          })
          .catch((err) =>
            console.error("CRITICAL LOG: Error loading templates:", err),
          );
      });

      function initializeSystemControls() {
        console.log("LOG: Initializing elements and event hooks...");
        loginScreen = document.getElementById("loginScreen");
        loginForm = document.getElementById("loginForm");
        formModal = document.getElementById("formModal");
        recordForm = document.getElementById("recordForm");
        boxTypeDropdown = document.getElementById("box_type");
        packageDropdown = document.getElementById("package");

        // --- ASYNC PASSWORD VISIBILITY ICON WIRE EVENT ROUTINE ---
        const passwordInput = document.getElementById("loginPass");
        const toggleIcon = document.getElementById("togglePasswordBtn");

        if (passwordInput && toggleIcon) {
          toggleIcon.addEventListener("click", () => {
            if (passwordInput.type === "password") {
              passwordInput.type = "text";
              toggleIcon.className =
                "fa-solid fa-eye-slash toggle-password-btn";
            } else {
              passwordInput.type = "password";
              toggleIcon.className = "fa-solid fa-eye toggle-password-btn";
            }
          });
          console.log("LOG: Password hide/show event listener bound smoothly.");
        }

        if (sessionStorage.getItem("db_authenticated") === "true") {
          console.log(
            "LOG: Found active auth token session. Bypassing login card.",
          );
          grantAccess(false);
        }

        // --- ASYNC CLOUD AUTHENTICATION ROUTINE WITH STABLE MODAL WRAPPERS ---
        if (loginForm) {
          loginForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            console.log(
              "LOG: Login form submitted. Triggering loader spinner...",
            );

            try {
              Swal.fire({
                title: "Checking credentials...",
                allowOutsideClick: false,
                didOpen: () => {
                  Swal.showLoading();
                },
              });
            } catch (swalErr) {
              console.error("LOG: SweetAlert error:", swalErr);
            }

            const user = document.getElementById("loginUser").value.trim();
            const pass = document.getElementById("loginPass").value;

            try {
              const encryptedPassword = await generateSHA256(pass);
              console.log("LOG: Local SHA-256 signature calculated safely.");

              console.log("LOG: Executing query match on 'users' table...");
              const { data, error } = await _supabase
                .from("users")
                .select("username")
                .eq("username", user)
                .eq("password_hash", encryptedPassword)
                .maybeSingle();

              if (error) {
                console.error(
                  "LOG: Supabase returned a transaction error status:",
                  error,
                );
                throw error;
              }

              console.log(
                "LOG: Closing background loading animation overlay grid...",
              );
              Swal.close();

              if (data) {
                console.log(
                  "LOG: Cloud authentication handshake verify match found.",
                );
                sessionStorage.setItem("db_authenticated", "true");
                grantAccess(true);
              } else {
                console.warn(
                  "LOG: Credential pairing match rejected by database pipeline engine.",
                );

                // Microtask padding guarantees loader frame cleanly fully unmounts before rendering the mismatch modal
                setTimeout(() => {
                  console.log(
                    "LOG: Triggering 'Login Failed' alert popup modal window...",
                  );
                  try {
                    Swal.fire({
                      title: "Login Failed",
                      text: "Incorrect credentials. Please check your username and password.",
                      icon: "warning",
                      confirmButtonColor: "#2563eb",
                    });
                  } catch (swalErr) {
                    console.error("LOG: SweetAlert error on fail:", swalErr);
                    alert("Login Failed: Incorrect credentials.");
                  }
                }, 300);
              }
            } catch (err) {
              console.error(
                "LOG: Authentication critical query breakdown catch-block catch:",
                err,
              );

              try {
                Swal.close();
              } catch (e) {
                console.error("LOG: Error closing SweetAlert:", e);
              }

              setTimeout(() => {
                try {
                  Swal.fire({
                    title: "Connection Error",
                    text:
                      err.message ||
                      "Unable to reach the security authentication server.",
                    icon: "error",
                    confirmButtonColor: "#2563eb",
                  });
                } catch (swalErr) {
                  console.error("LOG: SweetAlert error on exception:", swalErr);
                  alert("Error: " + (err.message || "Connection failed"));
                }
              }, 300);
            }
          });
        } else {
          console.error("LOG: loginForm element not found!");
        }

        document
          .getElementById("logoutBtn")
          .addEventListener("click", function () {
            console.log("LOG: Logging out. Wiping session.");
            sessionStorage.removeItem("db_authenticated");
            location.reload();
          });

        boxTypeDropdown.addEventListener("change", function () {
          populatePackages(this.value);
        });

        document
          .getElementById("openModalBtn")
          .addEventListener("click", () => {
            currentEditRecordId = null;
            formModal.querySelector("h3").textContent = "Add Record Entry";
            recordForm.reset();
            document.getElementById("record_date").value =
              getLocalDateISOString();
            packageDropdown.innerHTML =
              '<option value="" disabled selected hidden>Select box type first...</option>';
            packageDropdown.disabled = true;
            formModal.classList.add("active");
          });

        function hideModal() {
          formModal.classList.remove("active");
          recordForm.reset();
          currentEditRecordId = null;
        }

        const closeModalIcon = document.getElementById("closeModalIcon");
        const closeModalBtn = document.getElementById("closeModalBtn");

        closeModalIcon.addEventListener("click", hideModal);
        closeModalBtn.addEventListener("click", hideModal);
        formModal.addEventListener("click", (e) => {
          if (e.target === formModal) hideModal();
        });

        recordForm.addEventListener("submit", async function (e) {
          e.preventDefault();

          Swal.fire({
            title: "Processing Request...",
            allowOutsideClick: false,
            didOpen: () => {
              Swal.showLoading();
            },
          });

          const recordData = {
            owner: document.getElementById("owner").value.trim(),
            box_number: document.getElementById("box_number").value.trim(),
            pin: parseInt(document.getElementById("pin").value) || 0,
            package: packageDropdown.value,
            box_type: boxTypeDropdown.value,
            record_date: document.getElementById("record_date").value,
            note: document.getElementById("note").value.trim(),
          };

          try {
            if (currentEditRecordId !== null) {
              const { error } = await _supabase
                .from("load_records")
                .update(recordData)
                .eq("id", currentEditRecordId);

              if (error) throw error;

              Swal.fire({
                title: "Updated!",
                text: "Record changed successfully.",
                icon: "success",
                confirmButtonColor: "#2563eb",
              });
            } else {
              const { error } = await _supabase
                .from("load_records")
                .insert([recordData]);

              if (error) throw error;

              Swal.fire({
                title: "Saved!",
                text: "New entry added successfully.",
                icon: "success",
                confirmButtonColor: "#2563eb",
              });
            }

            hideModal();
            await fetchCloudRecords();
          } catch (error) {
            console.error("LOG: Database action threw an error:", error);
            Swal.fire({
              title: "Error!",
              text:
                error.message ||
                "An unexpected system fault occurred while saving data.",
              icon: "error",
              confirmButtonColor: "#2563eb",
            });
          }
        });
      }

      async function fetchCloudRecords() {
        if (sessionStorage.getItem("db_authenticated") !== "true") return;

        const { data, error } = await _supabase
          .from("load_records")
          .select("*")
          .order("record_date", { ascending: false });

        if (error) {
          console.error("LOG: Supabase network select read error:", error);
          Swal.fire({
            title: "Database Error",
            text: error.message,
            icon: "error",
          });
          return;
        }

        db = data.map((row) => ({
          record_id: row.id,
          ...row,
        }));

        renderTable();
      }

      function grantAccess(animate) {
        const proceed = () => {
          loginScreen.style.display = "none";
          dashboardContainer.style.display = "block";
          fetchCloudRecords();
        };

        if (animate) {
          loginScreen.style.opacity = "0";
          setTimeout(proceed, 300);
        } else {
          proceed();
        }
      }

      function populatePackages(selectedBrand, currentVal = null) {
        packageDropdown.innerHTML = "";
        packageDropdown.disabled = false;
        if (packageMatrix[selectedBrand]) {
          packageMatrix[selectedBrand].forEach((price) => {
            const optionEl = document.createElement("option");
            optionEl.value = price;
            optionEl.textContent = price;
            if (currentVal && price === currentVal) optionEl.selected = true;
            packageDropdown.appendChild(optionEl);
          });
        }
      }

      function editRecord(recordId) {
        const record = db.find((r) => r.record_id === recordId);
        if (!record || !formModal) return;

        currentEditRecordId = recordId;
        formModal.querySelector("h3").textContent =
          `Edit Record Entry (#${recordId})`;

        document.getElementById("owner").value = record.owner;
        document.getElementById("box_number").value = record.box_number;
        document.getElementById("pin").value = record.pin;
        document.getElementById("record_date").value = record.record_date;
        document.getElementById("note").value = record.note;
        boxTypeDropdown.value = record.box_type;

        populatePackages(record.box_type, record.package);
        formModal.classList.add("active");
      }

      function renderTable() {
        tableBody.innerHTML = "";

        db.sort((a, b) => {
          const dateA = new Date(a.record_date);
          const dateB = new Date(b.record_date);
          if (dateB - dateA !== 0) return dateB - dateA;
          return b.record_id - a.record_id;
        });

        const searchQuery = searchInput.value.toLowerCase().trim();
        const selectedBoxType = boxTypeFilter.value.toUpperCase().trim();

        filteredRecords = db.filter((record) => {
          const recordOwner = (record.owner || "").toLowerCase();
          const recordBoxNumber = (record.box_number || "").toLowerCase();
          const recordBoxType = (record.box_type || "").toUpperCase().trim();
          const recordPackage = (record.package || "").toLowerCase();
          const recordNote = (record.note || "").toLowerCase();

          const matchesSearch =
            recordOwner.includes(searchQuery) ||
            recordBoxNumber.includes(searchQuery) ||
            recordBoxType.toLowerCase().includes(searchQuery) ||
            recordPackage.includes(searchQuery) ||
            recordNote.includes(searchQuery);

          const matchesBoxType =
            selectedBoxType === "ALL" || recordBoxType === selectedBoxType;
          return matchesSearch && matchesBoxType;
        });

        const totalItems = filteredRecords.length;
        const totalPages = Math.ceil(totalItems / rowsPerPage) || 1;

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIdx = (currentPage - 1) * rowsPerPage;
        const endIdx = Math.min(startIdx + rowsPerPage, totalItems);
        const pageData = filteredRecords.slice(startIdx, endIdx);

        if (pageData.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#475569; font-weight:600; padding: 40px;">No records match your filters.</td></tr>`;
          updatePaginationControls(totalPages, 0, 0, 0);
          return;
        }

        pageData.forEach((record) => {
          const row = document.createElement("tr");

          const normalizedType = (record.box_type || "").toUpperCase().trim();
          if (normalizedType === "GSAT HD" || normalizedType === "GSAT PNOY") {
            row.className = "box-gsat";
          } else if (normalizedType === "SATLITE") {
            row.className = "box-satlite";
          } else if (normalizedType === "CIGNAL") {
            row.className = "box-cignal";
          }

          row.innerHTML = `
                <td><small style="color:#64748b; font-weight: 600;">#${record.record_id}</small></td>
                <td><strong>${escapeHTML(record.owner)}</strong></td>
                <td><code>${escapeHTML(record.box_number)}</code></td>
                <td>${record.pin}</td>
                <td><span class="badge-package">${escapeHTML(record.package)}</span></td>
                <td><span class="box-type-text">${escapeHTML(record.box_type)}</span></td>
                <td>${formatDateToLongStyle(record.record_date)}</td>
                <td><i style="color:#64748b; font-size:0.9rem;">${escapeHTML(record.note || "—")}</i></td>
                <td>
                    <div class="btn-action-group">
                        <button class="btn-edit" onclick="editRecord(${record.record_id})"><i class="fa-solid fa-pen-to-square"></i>Edit</button>
                        <button class="btn-delete" onclick="deleteCloudRecord(${record.record_id})"><i class="fa-solid fa-trash-can"></i>Delete</button>
                    </div>
                </td>
            `;
          tableBody.appendChild(row);
        });

        updatePaginationControls(totalPages, startIdx + 1, endIdx, totalItems);
      }

      function formatDateToLongStyle(dateString) {
        if (!dateString) return "—";
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return dateString;
        const options = { year: "numeric", month: "long", day: "numeric" };
        return date.toLocaleDateString("en-US", options);
      }

      async function deleteCloudRecord(recordId) {
        const confirm = await Swal.fire({
          title: "Delete Record?",
          text: "This action cannot be undone.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#ff3737",
          cancelButtonColor: "#6b7280",
          confirmButtonText: "Delete",
          cancelButtonText: "Cancel",
        });

        if (!confirm.isConfirmed) return;

        Swal.fire({
          title: "Deleting...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        try {
          const { error } = await _supabase
            .from("load_records")
            .delete()
            .eq("id", recordId);

          if (error) throw error;

          Swal.fire({
            title: "Deleted!",
            text: "Record removed successfully.",
            icon: "success",
            confirmButtonColor: "#2563eb",
          });

          await fetchCloudRecords();
        } catch (error) {
          console.error("LOG: Delete operation failed:", error);
          Swal.fire({
            title: "Error!",
            text: error.message || "Failed to delete record.",
            icon: "error",
            confirmButtonColor: "#2563eb",
          });
        }
      }

      window.editRecord = editRecord;
      window.deleteCloudRecord = deleteCloudRecord;

      function updatePaginationControls(totalPages, start, end, total) {
        paginationInfo.innerHTML = `<i class="fa-solid fa-chart-simple" style="margin-right: 8px; color: var(--text-muted);"></i>Showing ${start} to ${end} of ${total} entries`;
        paginationButtons.innerHTML = "";

        const prevBtn = document.createElement("button");
        prevBtn.className = "btn-page";
        prevBtn.innerHTML = `<i class="fa-solid fa-angle-left"></i>Prev`;
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
          currentPage--;
          renderTable();
        };
        paginationButtons.appendChild(prevBtn);

        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) startPage = Math.max(1, endPage - 4);

        for (let i = startPage; i <= endPage; i++) {
          const pageBtn = document.createElement("button");
          pageBtn.className = `btn-page ${i === currentPage ? "active" : ""}`;
          pageBtn.textContent = i;
          pageBtn.onclick = () => {
            currentPage = i;
            renderTable();
          };
          paginationButtons.appendChild(pageBtn);
        }

        const nextBtn = document.createElement("button");
        nextBtn.className = "btn-page";
        nextBtn.innerHTML = `Next<i class="fa-solid fa-angle-right"></i>`;
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
          currentPage++;
          renderTable();
        };
        paginationButtons.appendChild(nextBtn);
      }

      function escapeHTML(str) {
        return str.replace(
          /[&<>'"]/g,
          (tag) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[tag] || tag,
        );
      }

      searchInput.addEventListener("input", () => {
        currentPage = 1;
        renderTable();
      });
      boxTypeFilter.addEventListener("change", () => {
        currentPage = 1;
        renderTable();
      });
      rowsPerPageSelect.addEventListener("change", (e) => {
        rowsPerPage = parseInt(e.target.value);
        currentPage = 1;
        renderTable();
      });
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        // Added 'js/' and the scope property so it can control the whole site
        navigator.serviceWorker
          .register("js/sw.js", { scope: "/4J-Loading-Portal/" })
          .then(() => console.log("Service Worker Registered Successfully"))
          .catch((err) => console.log("Service Worker Failed:", err));
      }
    </script>
  </body>
</html>
